name: Build and Release PDFs

on:
  push:
    branches: [main, master]
    paths:
      - 'subjects/**/*.tex'
      - 'subjects/**/*.sty'
  workflow_dispatch:
    inputs:
      subject:
        description: 'Subject to rebuild (leave empty for all changed)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.detect.outputs.subjects }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed subjects
        id: detect
        run: |
          # Если указан конкретный предмет
          if [ -n "${{ inputs.subject }}" ]; then
            if [ -f "subjects/${{ inputs.subject }}/main.tex" ]; then
              CHANGED="${{ inputs.subject }}"
            else
              echo "Subject ${{ inputs.subject }} not found"
              exit 1
            fi
          elif [ -z "$(git rev-parse HEAD~1 2>/dev/null)" ]; then
            # Первый коммит — собрать все
            CHANGED=$(find subjects -maxdepth 1 -mindepth 1 -type d -exec basename {} \; 2>/dev/null | sort || echo "")
          else
            # Найти изменённые предметы
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep "^subjects/" | cut -d'/' -f2 | sort -u || echo "")
          fi

          # Фильтровать только существующие
          VALID=""
          for subj in $CHANGED; do
            if [ -f "subjects/$subj/main.tex" ]; then
              VALID="$VALID $subj"
            fi
          done
          VALID=$(echo $VALID | xargs)

          echo "Subjects to build: $VALID"

          if [ -n "$VALID" ]; then
            MATRIX=$(echo "$VALID" | tr ' ' '\n' | jq -R . | jq -s -c '{subject: .}')
          else
            MATRIX='{"subject":[]}'
          fi

          echo "subjects=$VALID" >> $GITHUB_OUTPUT
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-release:
    needs: detect-changes
    if: needs.detect-changes.outputs.subjects != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-fonts-extra \
            texlive-lang-cyrillic \
            texlive-latex-extra \
            texlive-science \
            fonts-paratype \
            latexmk

      - name: Install JetBrains Mono
        run: |
          mkdir -p ~/.local/share/fonts/jetbrains-mono
          cd ~/.local/share/fonts/jetbrains-mono
          wget -q https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
          unzip -q JetBrainsMono-2.304.zip
          # Удаляем variable fonts, оставляем только статические
          rm -rf fonts/variable
          fc-cache -f -v

      - name: Get version info
        id: version
        run: |
          SUBJECT="${{ matrix.subject }}"
          SUBJECT_DIR="subjects/$SUBJECT"

          # Количество коммитов для этого предмета
          COMMIT_COUNT=$(git rev-list --count HEAD -- "$SUBJECT_DIR")

          # Дата последнего изменения
          LAST_DATE=$(git log -1 --format="%cs" -- "$SUBJECT_DIR" | tr -d '-')

          # Версия
          VERSION="v${LAST_DATE}.${COMMIT_COUNT}"

          # Название предмета из main.tex
          COURSE_NAME=$(grep -o '\\setcoursename{[^}]*}' "$SUBJECT_DIR/main.tex" | sed 's/\\setcoursename{//;s/}//' || echo "$SUBJECT")

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "course_name=$COURSE_NAME" >> $GITHUB_OUTPUT
          echo "date=$(date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Build PDF
        run: |
          cd "subjects/${{ matrix.subject }}"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Prepare release files
        run: |
          SUBJECT="${{ matrix.subject }}"
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p release
          cp "subjects/$SUBJECT/main.pdf" "release/${SUBJECT}.pdf"
          cp "subjects/$SUBJECT/main.pdf" "release/${SUBJECT}-${VERSION}.pdf"

      - name: Delete old release for this subject
        run: |
          gh release delete "${{ matrix.subject }}" --yes 2>/dev/null || true
          git push origin :refs/tags/${{ matrix.subject }} 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release for subject
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ matrix.subject }}
          name: "📄 ${{ steps.version.outputs.course_name }}"
          body: |
            # ${{ steps.version.outputs.course_name }}

            **Версия:** `${{ steps.version.outputs.version }}`
            **Обновлено:** ${{ steps.version.outputs.date }}

            ## Скачать

            - 📥 **[${{ matrix.subject }}.pdf](https://github.com/${{ github.repository }}/releases/download/${{ matrix.subject }}/${{ matrix.subject }}.pdf)** — актуальная версия
            - 📥 [${{ matrix.subject }}-${{ steps.version.outputs.version }}.pdf](https://github.com/${{ github.repository }}/releases/download/${{ matrix.subject }}/${{ matrix.subject }}-${{ steps.version.outputs.version }}.pdf) — версия ${{ steps.version.outputs.version }}
          files: release/*.pdf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
